groups:

- name: security

  interval: 10s

  rules:

  - record: security_alerts_per_minute

    expr: |
      sum(
        count_over_time(
          {filename=~".+"}
          |= "security alert"
          [1m]
        )
      )

  - alert: TooManySecurityAlerts

    expr: |
      sum(
        count_over_time(
          {filename=~".+"}
          |= "security alert"
          [1m]
        )
      ) > 5

    for: 10s

    labels:

      severity: critical

    annotations:

      summary: Too many security alerts