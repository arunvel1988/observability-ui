auth_enabled: true


server:
  http_listen_port: 3100



common:

  path_prefix: /tmp/loki

  replication_factor: 1

  ring:
    kvstore:
      store: inmemory



schema_config:

 configs:

 - from: 2024-01-01

   store: tsdb

   object_store: s3

   schema: v13

   index:
     prefix: index_
     period: 24h




storage_config:

 aws:

  endpoint: minio:9000

  bucketnames: loki-data

  access_key_id: minio

  secret_access_key: miniopassword

  s3forcepathstyle: true

  insecure: true





ingester:

 chunk_idle_period: 30s

 max_chunk_age: 1m

 chunk_retain_period: 10s

 wal:

  enabled: true

  dir: /tmp/loki/wal





compactor:

 working_directory: /tmp/loki/compactor






ruler:


 enable_api: true


 storage:

  type: local

  local:

   directory: /rules



 rule_path: /tmp/loki/rules-temp



 remote_write:

  enabled: true


  clients:


   mimir:


    url: http://mimir:9009/api/v1/push


    headers:


     X-Scope-OrgID: audit






limits_config:


 allow_structured_metadata: true