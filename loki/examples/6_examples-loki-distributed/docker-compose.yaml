version: "3.9"

services:

  minio:

    image: minio/minio

    command: server /data --console-address ":9001"

    environment:

      MINIO_ROOT_USER: admin

      MINIO_ROOT_PASSWORD: password123

    ports:

      - "9000:9000"

      - "9001:9001"

    volumes:

      - ./minio:/data



  createbuckets:

    image: minio/mc

    depends_on:

      - minio

    entrypoint: >
      /bin/sh -c "
      sleep 15;

      mc alias set local
      http://minio:9000
      admin
      password123;

      mc mb -p local/loki-data || true;

      mc anonymous set private local/loki-data;

      exit 0;
      "



  alloy:

    image: grafana/alloy:latest

    command:

      - run

      - /etc/alloy/config.alloy

    ports:

      - "12345:12345"

    volumes:

      - ./alloy/config.alloy:/etc/alloy/config.alloy

      - /var/lib/docker/containers:/var/lib/docker/containers:ro



  app:

    build: ./app



  grafana:

    image: grafana/grafana:latest

    ports:

      - "3000:3000"

    volumes:

      - ./grafana/provisioning:/etc/grafana/provisioning