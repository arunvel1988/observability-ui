auth_enabled: true


server:

  http_listen_port: 3100



common:

  path_prefix: /loki

  replication_factor: 1

  ring:

    kvstore:

      store: inmemory




schema_config:

  configs:

    - from: 2024-01-01

      store: tsdb

      object_store: s3

      schema: v13

      index:

        prefix: index_

        period: 24h





storage_config:

  aws:

    endpoint: minio:9000

    bucketnames: loki

    access_key_id: admin

    secret_access_key: password123

    s3forcepathstyle: true

    insecure: true





limits_config:

  ingestion_rate_mb: 5

  ingestion_burst_size_mb: 10

  retention_period: 180d





compactor:

  working_directory: /tmp/compactor

  retention_enabled: true

  delete_request_store: s3





runtime_config:

  file: /etc/loki/runtime.yml