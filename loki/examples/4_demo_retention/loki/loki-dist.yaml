auth_enabled: true


server:

  http_listen_port: 3100



common:

  path_prefix: /loki

  replication_factor: 1

  ring:

    kvstore:

      store: inmemory



############################
# DISTRIBUTOR CONFIGURATION
############################

distributor:

  ring:

    kvstore:

      store: inmemory



############################
# INGESTER CONFIGURATION
############################

ingester:


  lifecycler:

    ring:

      kvstore:

        store: inmemory


      replication_factor: 1



  chunk_idle_period: 5m

  chunk_retain_period: 30s

  max_chunk_age: 1h





############################
# TSDB INDEX CONFIGURATION
############################

schema_config:

  configs:


    - from: 2024-01-01


      store: tsdb


      object_store: s3


      schema: v13


      index:


        prefix: index_


        period: 24h





############################
# MINIO S3 STORAGE
############################

storage_config:


  aws:


    endpoint: minio:9000


    bucketnames: loki


    access_key_id: admin


    secret_access_key: password123


    s3forcepathstyle: true


    insecure: true






############################
# DISTRIBUTOR LIMIT CHECKS
############################

limits_config:


  #################################
  # Distributor rate limiting
  #################################


  ingestion_rate_strategy: global


  ingestion_rate_mb: 5


  ingestion_burst_size_mb: 10



  #################################
  # Per stream protection
  #################################


  per_stream_rate_limit: 3MB


  per_stream_rate_limit_burst: 10MB





  #################################
  # Cardinality protection
  #################################


  max_label_names_per_series: 15


  max_label_value_length: 2048


  max_label_name_length: 1024



  max_global_streams_per_user: 50000


  max_streams_per_user: 10000





  #################################
  # Old sample protection
  #################################


  reject_old_samples: true


  reject_old_samples_max_age: 168h





  #################################
  # default retention
  #################################


  retention_period: 180d






############################
# COMPACTOR
# Deletes expired logs
############################

compactor:


  working_directory: /tmp/loki/compactor


  retention_enabled: true


  delete_request_store: s3







############################
# TENANT OVERRIDES
############################


runtime_config:


  file: /etc/loki/runtime.yml