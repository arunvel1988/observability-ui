<!DOCTYPE html>

<html>

<head>

<title>Faro Ecommerce</title>


<script src="https://unpkg.com/@grafana/faro-web-sdk@1.12.0/dist/bundle/faro-web-sdk.iife.js"></script>

<script src="https://unpkg.com/@grafana/faro-web-tracing@1.12.0/dist/bundle/faro-web-tracing.iife.js"></script>


<script>


window.addEventListener("load", function(){


console.log("Starting Faro");


window.faro = window.GrafanaFaroWebSdk.initializeFaro({


    url: "http://localhost:12347/collect",


    app: {

        name: "ecommerce",

        version: "1.0"

    },


    instrumentations: [

        ...window.GrafanaFaroWebSdk.getWebInstrumentations(),

        new window.GrafanaFaroWebTracing.TracingInstrumentation()

    ]


});



window.faro.api.pushLog(

    ["FRONTEND PAGE LOADED FROM BROWSER"],

    {
        level:"info"
    }

);


console.log("Faro Started");


});







function addCart(){


console.log("Add cart clicked");


window.faro.api.pushLog(

[
"USER CLICKED ADD CART BUTTON"
],

{
level:"info"
}

);


}





function checkout(){


try {


let payment=null;


payment.id;



}

catch(e){


window.faro.api.pushError(e);


}


}





function loginFail(){


window.faro.api.pushError(

new Error("LOGIN FAILED FROM FRONTEND")

);


}


</script>


</head>


<body>


<h1>
Faro Ecommerce Test
</h1>


<button onclick="addCart()">

Add Cart

</button>


<button onclick="checkout()">

Checkout Error

</button>


<button onclick="loginFail()">

Login Error

</button>


</body>

</html>
