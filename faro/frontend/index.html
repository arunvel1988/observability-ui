<!DOCTYPE html>
<html>

<head>

<title>Faro Test</title>

<script src="https://unpkg.com/@grafana/faro-web-sdk@1.15.0/dist/bundle/faro-web-sdk.iife.js"></script>


<script>


window.onload = () => {


    console.log(window.GrafanaFaroWebSdk);


    const faro = window.GrafanaFaroWebSdk.faro;


    window.GrafanaFaroWebSdk.initializeFaro({


        url: "http://localhost:12347/collect",


        app: {

            name: "ecommerce",

            version: "1"

        }

    });



    faro.api.pushLog(

        ["BROWSER FARO STARTED"],

        {

            level:"info"

        }

    );


};




function cart(){


    window.GrafanaFaroWebSdk.faro.api.pushLog(

        ["CUSTOMER CLICKED CART FROM HTML"],

        {

            level:"info"

        }

    );


}




function fail(){


    try {


        let x = null;


        x.test;


    }

    catch(e){


        window.GrafanaFaroWebSdk.faro.api.pushError(e);


    }


}


</script>

</head>



<body>


<h1>Faro Browser Demo</h1>


<button onclick="cart()">

Cart

</button>


<button onclick="fail()">

Generate Error

</button>


</body>

</html>
