<!DOCTYPE html>

<html>


<head>


<title>

Ecommerce Faro Demo

</title>



<style>


body{

background:#111827;

color:white;

font-family:Arial;

padding:50px;

}



.container{

background:#1f2937;

padding:30px;

border-radius:15px;

width:600px;

}



button{


display:block;

width:300px;

padding:15px;

margin:15px;

font-size:18px;


}



</style>






<script src="https://unpkg.com/@grafana/faro-web-sdk/dist/bundle/faro-web-sdk.iife.js">
</script>







<script>


const faro =

window.GrafanaFaroWebSdk.initializeFaro({



url:

"http://localhost:12347/collect",



app:{


name:"ecommerce-ui",


version:"1.0"


}



});








function addCart(){



faro.api.pushLog([

"Customer added product to cart"

]);



document.getElementById("status").innerHTML=

"Product Added";


}










function checkoutFailure(){



try{


faro.api.pushLog([

"Checkout started"

]);



let payment=null;



payment.id;



}



catch(error){



faro.api.pushError(error);



document.getElementById("status").innerHTML=

"Payment Failed";


}



}









function slowPayment(){



faro.api.pushLog([

"Slow payment request started"

]);



setTimeout(()=>{


faro.api.pushLog([

"Payment gateway response took 5 seconds"

]);



document.getElementById("status").innerHTML=

"Slow Payment Completed";



},5000);



}










function loginError(){



try{



throw new Error(

"Authentication token expired"

);



}


catch(error){



faro.api.pushError(error);



document.getElementById("status").innerHTML=

"Login Error";



}



}







</script>


</head>







<body>



<h1>

Ecommerce Application

</h1>



<h3>

Grafana Faro + Alloy + Loki

</h3>




<div class="container">



<button onclick="addCart()">

Add To Cart Success

</button>




<button onclick="checkoutFailure()">

Checkout Payment Failure

</button>





<button onclick="slowPayment()">

Slow Payment Gateway

</button>





<button onclick="loginError()">

Login Failure

</button>





<h2 id="status">

Waiting...

</h2>




</div>




</body>


</html>
