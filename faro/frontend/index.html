<!DOCTYPE html>
<html>

<head>

<title>Faro Ecommerce Demo</title>


<script src="https://unpkg.com/@grafana/faro-web-sdk@latest/dist/bundle/faro-web-sdk.iife.js"></script>


<script>


let faro;


window.onload = function(){


    faro = window.GrafanaFaroWebSdk.initializeFaro({


        url: "http://localhost:12347/collect",


        app: {

            name: "ecommerce",

            version: "1"

        }


    });



    faro.api.pushLog(

        ["ECOMMERCE PAGE LOADED"],

        {

            level:"info"

        }

    );


};







function addCart(){



    faro.api.pushLog(

        [

        "CUSTOMER ADDED FOOTBALL JERSEY TO CART"

        ],

        {

        level:"info"

        }

    );



    document.getElementById("result").innerHTML=

    "Cart Added";


}








function checkout(){


    try{


        let payment = null;


        payment.transaction.id;


    }


    catch(error){


        faro.api.pushError(error);


        document.getElementById("result").innerHTML=

        "Payment Error";


    }


}









function slowApi(){



    faro.api.pushLog(

      [

      "PAYMENT API SLOW RESPONSE 5 SECOND"

      ],

      {

      level:"warn"

      }

    );



}








function loginFail(){


    let err = new Error(

        "LOGIN TOKEN EXPIRED"

    );


    faro.api.pushError(err);



}



</script>


<style>


body {

background:#111827;

color:white;

font-family:Arial;

padding:40px;

}



button {

padding:15px;

font-size:20px;

margin:10px;

display:block;

}



</style>


</head>



<body>


<h1>

Ecommerce Faro Real User Monitoring

</h1>


<button onclick="addCart()">

Add Cart

</button>



<button onclick="checkout()">

Checkout Failure

</button>



<button onclick="slowApi()">

Slow Payment API

</button>



<button onclick="loginFail()">

Login Failure

</button>


<h2 id="result"></h2>


</body>

</html>
