<!DOCTYPE html>
<html>

<head>

<title>
Faro Ecommerce Demo
</title>

</head>


<body>


<h1>
Ecommerce Faro Test
</h1>


<button onclick="addCart()">
Add Cart
</button>


<button onclick="paymentError()">
Payment Error
</button>


<h2 id="msg"></h2>





<script src="https://unpkg.com/@grafana/faro-web-sdk@1.15.0/dist/bundle/faro-web-sdk.iife.js"></script>


<script>


console.log("Loading Faro");


const faro = window.GrafanaFaroWebSdk.initializeFaro({


    url: "http://localhost:12347/collect",


    app: {

        name: "ecommerce",

        version: "1.0"

    }

});



console.log("Faro object", faro);



// SEND TEST LOG IMMEDIATELY

faro.api.pushLog(

    ["BROWSER STARTED FARO SUCCESSFULLY"],

    {

        level: "info"

    }

);







function addCart(){


    console.log("cart clicked");


    faro.api.pushLog(

        ["USER CLICKED ADD CART"],

        {

            level:"info"

        }

    );



    document.getElementById("msg").innerHTML=

    "Cart Added";


}







function paymentError(){



    try {


        let payment = undefined;


        payment.id;



    } catch(err){



        console.log("sending error",err);



        faro.api.pushError(err);



    }



}


</script>


</body>


</html>
