apiVersion: apps/v1

kind: Deployment

metadata:

  name: mimir-demo-app

  labels:

    app: mimir-demo-app


spec:

  replicas: 2


  selector:

    matchLabels:

      app: mimir-demo-app


  template:

    metadata:

      labels:

        app: mimir-demo-app


    spec:

      containers:

      - name: app

        image: mimir-demo-app:v1

        imagePullPolicy: Never


        ports:

        - containerPort: 8000



---

apiVersion: v1

kind: Service

metadata:

  name: mimir-demo-app


spec:

  selector:

    app: mimir-demo-app


  ports:

  - name: metrics

    port: 8000

    targetPort: 8000
