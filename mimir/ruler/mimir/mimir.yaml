target: all

multitenancy_enabled: false


server:
  http_listen_port: 9009


common:
  storage:
    backend: filesystem


blocks_storage:
  backend: filesystem

  filesystem:
    dir: /data/blocks

  tsdb:
    dir: /data/tsdb


ingester:
  ring:
    replication_factor: 1


ruler:
  enable_api: true

  rule_path: /tmp/mimir-rules

  evaluation_interval: 10s

  ring:
    kvstore:
      store: inmemory


ruler_storage:
  backend: local

  local:
    directory: /rules


compactor:
  data_dir: /data/compactor


store_gateway:
  sharding_ring:
    replication_factor: 1
