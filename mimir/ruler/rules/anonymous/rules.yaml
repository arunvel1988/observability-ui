groups:

- name: order_rules

  interval: 10s

  rules:

  - record: app_orders_total

    expr: orders_total


  - record: app_orders_5m

    expr: increase(orders_total[5m])


  - alert: HighOrders

    expr: increase(orders_total[5m]) > 10

    for: 10s

    labels:

      severity: warning

    annotations:

      message: High order volume detected
