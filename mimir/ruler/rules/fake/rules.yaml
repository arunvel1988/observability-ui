groups:

- name: order_rules


  interval: 10s


  rules:


  - record: app:orders:rate1m


    expr: rate(orders_total[1m])



  - alert: HighFailedOrders


    expr: rate(orders_total{status="failed"}[1m]) > 0.1


    for: 20s


    labels:

      severity: warning


    annotations:

      message: Too many failed orders
