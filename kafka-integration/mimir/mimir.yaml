target: distributor,ingester,querier,store-gateway,compactor


multitenancy_enabled: false


server:
  http_listen_port: 9009


common:

  storage:

    backend: filesystem



blocks_storage:

  backend: filesystem


  filesystem:

    dir: /data/blocks


  tsdb:

    dir: /data/tsdb



ingester:

  ring:

    replication_factor: 1


    kvstore:

      store: inmemory



distributor:

  ring:

    kvstore:

      store: inmemory



store_gateway:

  sharding_ring:

    replication_factor: 1


    kvstore:

      store: inmemory



compactor:

  data_dir: /data/compactor



ingest_storage:

  enabled: true


  kafka:

    address: kafka:9092

    topic: mimir-ingest



limits:

  max_global_series_per_user: 100000
