
stream_over_http_enabled: true


server:
  http_listen_port: 3200



distributor:

  receivers:

    otlp:

      protocols:

        grpc:

          endpoint: 0.0.0.0:4317

        http:

          endpoint: 0.0.0.0:4318





live_store:


  max_trace_idle: 10s


  max_block_duration: 1m


  max_block_bytes: 1000000





backend_scheduler:


  provider:


    compaction:


      compaction:


        compaction_window: 1h


        max_block_bytes: 100000000


        block_retention: 24h


        compacted_block_retention: 10m







storage:


  trace:


    backend: s3


    wal:

      path: /tmp/tempo/wal



    s3:


      bucket: tempo-data


      endpoint: minio:9000


      access_key: admin


      secret_key: password123


      insecure: true



    block:


      bloom_filter_false_positive: 0.05



    pool:


      max_workers: 100


      queue_depth: 10000








metrics_generator:



  processor:



    span_metrics:



      dimensions:


        - http.method


        - http.status_code


        - service.name





    service_graphs:


      dimensions:


        - http.method


        - http.status_code


        - service.name






  registry:


    collection_interval: 5s


    external_labels:


      source: tempo





  storage:


    path: /tmp/tempo/generator/wal



    remote_write:



      - url: http://mimir:9009/api/v1/push


        send_exemplars: true







overrides:


  defaults:


    metrics_generator:


      processors:


        - service-graphs


        - span-metrics






usage_report:

  reporting_enabled: false

