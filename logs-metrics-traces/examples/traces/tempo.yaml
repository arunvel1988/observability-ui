server:
  http_listen_port: 3200


distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318


ingester:
  trace_idle_period: 10s
  max_block_duration: 1m


compactor:
  compaction:
    block_retention: 24h


storage:
  trace:
    backend: s3

    wal:
      path: /tmp/tempo/wal

    s3:
      bucket: tempo-data
      endpoint: minio:9000
      access_key: admin
      secret_key: password123
      insecure: true


querier:
  frontend_worker:
    frontend_address: tempo:9095


query_frontend:


metrics_generator:
  storage:
    path: /tmp/tempo/generator/wal

